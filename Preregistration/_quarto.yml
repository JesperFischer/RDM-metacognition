  - id: ucl
    name: "Institute of NeuroScience, Université catholique de Louvain, Brussels, Belgium"
  - id: cambridge
    name: "Cambridge Psychiatry, University of Cambridge, United Kingdom"

bibliography: "Knitting files/references.bib"
csl: "Knitting files/chicago-author-date.csl"
