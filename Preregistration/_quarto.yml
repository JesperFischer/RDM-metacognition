  output-dir: _book

book:
  title: "Metacognitive Uncertainty across the Post-Decisional Response Window"
  footnotes:
    equal-contrib: "Equal contribution"
  author:
    - name: "Jesper Fischer Ehmsen^*"
      affiliations:
        - ref: cfin
    - name: "Siebe Everaerts^*"
      affiliations:
        - ref: leuven
    - name: "Arthur S. Courtin"
      affiliations:
        - ref: cfin
        - ref: ucl
    - name: "Kelly Hoogervorst"
      affiliations:
        - ref: cfin
    - name: "Micah G. Allen"
      affiliations:
        - ref: cfin
        - ref: cambridge
    - name: "Francesca Fardo"
      affiliations:
        - ref: cfin
  chapters:
    - index.qmd
    - part1-models-data.qmd
    - part2-current-model.qmd
    - part3-design-methods.qmd
    - part4-sequential-sampling.qmd
    - references.qmd

affiliations:
  - id: cfin
    name: "Center of Functionally Integrative Neuroscience (CFIN), Department of Clinical Medicine, Aarhus University"
  - id: leuven
