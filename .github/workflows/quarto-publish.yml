name: Build and Deploy Preregistration

on:
  push:
    branches: [main, dev]
    paths:
      - 'Preregistration/**'
      - '.github/workflows/quarto-publish.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Preregistration/**'
      - '.github/workflows/quarto-publish.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagick++-dev libcurl4-openssl-dev \
            libxml2-dev libfontconfig1-dev libfreetype6-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev

      - name: Install R packages
        run: |
          install.packages(c(
            "here", "knitr", "yaml", "rmarkdown",
            "cowplot", "magick", "flextable", "truncnorm", "pdftools"
          ))
          install.packages("tidyverse")
        shell: Rscript {0}

      - name: Render Quarto book
        run: |
          cd Preregistration
          quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Preregistration/_book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
